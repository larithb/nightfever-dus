<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --ink: #EDE8DC;
    --ink-dim: #A9A6C4;
    --night: #14172B;
    --night-deep: #0C0E1D;
    --panel: #1C2040;
    --panel-line: #2C3060;
    --flame: #E8B657;
    --flame-dim: #6B5A30;
    --ember: #C97A4A;
    --ok: #7FAE8C;
    --radius: 14px;
  }

  #nf-root.nf-light {
    --ink: #2B2A3D;
    --ink-dim: #726F8C;
    --night: #F4F1EA;
    --night-deep: #FFFFFF;
    --panel: #FBF8F0;
    --panel-line: #E3DDCB;
  }

  * { box-sizing: border-box; }

  #nf-root {
    background: radial-gradient(ellipse 900px 500px at 50% -10%, #22265266, transparent), var(--night);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
    padding: 40px 20px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  @media (max-width: 480px) {
    #nf-root { padding: 24px 12px 60px; }
    section.nf-section, details.nf-section { padding: 16px 16px 14px; }
    details.nf-section summary { margin: -16px -16px 0; padding: 16px 16px 4px; }
    h1.nf-title { font-size: 30px; }
  }

  .nf-wrap { width: 100%; max-width: 640px; }

  .nf-install-hint {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--flame-dim);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--ink);
    width: 100%;
    max-width: 640px;
  }
  .nf-install-hint span { flex: 1; }
  .nf-install-hint button {
    background: var(--flame);
    color: #1C1508;
    border: none;
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .nf-install-hint .nf-hint-close {
    background: none;
    color: var(--ink-dim);
    padding: 4px 6px;
    font-weight: 400;
  }

  .nf-topbar {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    margin-bottom: 10px;
  }

  .nf-settings-toggle {
    position: absolute;
    right: 0;
    top: -4px;
    background: none;
    border: 1px solid var(--panel-line);
    color: var(--ink-dim);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, border-color 0.15s;
  }
  .nf-settings-toggle:hover { color: var(--flame); border-color: var(--flame-dim); }

  .nf-settings-panel {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 28px;
  }
  .nf-settings-panel h3 {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 10px;
    font-weight: 500;
  }
  .nf-swatches { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .nf-swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
  }
  .nf-swatch.nf-active { border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel); }
  .nf-mode-toggle { display: flex; gap: 8px; }
  .nf-mode-btn {
    background: var(--night-deep);
    border: 1px solid var(--panel-line);
    color: var(--ink-dim);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .nf-mode-btn.nf-active { color: var(--ink); border-color: var(--flame); }

  .nf-eyebrow {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--flame);
    text-align: center;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .nf-eyebrow svg { width: 12px; height: 16px; }

  h1.nf-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 40px;
    text-align: center;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .nf-sub {
    text-align: center;
    color: var(--ink-dim);
    font-size: 14px;
    margin-bottom: 32px;
  }

  .nf-event-inputs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 40px;
  }

  .nf-event-inputs input {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--ink);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
  }
  .nf-event-inputs input:focus { outline: 2px solid var(--flame); outline-offset: 1px; }
  .nf-event-inputs input[name="title"] { flex: 2; min-width: 200px; font-family: 'Fraunces', serif; font-size: 16px; }
  .nf-event-inputs input[name="date"] { flex: 1; min-width: 140px; }
  .nf-event-inputs input[name="place"] { flex: 1; min-width: 140px; }

  section.nf-section, details.nf-section {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    padding: 22px 22px 18px;
    margin-bottom: 22px;
  }

  details.nf-section summary {
    list-style: none;
    cursor: pointer;
    margin: -22px -22px 0;
    padding: 22px 22px 4px;
  }
  details.nf-section summary::-webkit-details-marker { display: none; }
  details.nf-section summary h2::before {
    content: '\25B8 ';
    display: inline-block;
    font-size: 12px;
    color: var(--ink-dim);
    transition: transform 0.2s;
    margin-right: 2px;
  }
  details.nf-section[open] summary h2::before { transform: rotate(90deg); }
  details.nf-section:not([open]) { padding-bottom: 22px; }
  details.nf-section:not([open]) .nf-hint { display: none; }

  .nf-section h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 19px;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nf-count {
    font-size: 12px;
    color: var(--ink-dim);
    font-weight: 400;
    font-family: 'Inter', sans-serif;
  }

  .nf-section .nf-hint { color: var(--ink-dim); font-size: 13px; margin: 0 0 16px; }

  .nf-list { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 8px; }

  .nf-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--night-deep);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 10px 12px;
  }

  .nf-row .nf-name { flex: 1; font-size: 14px; }
  .nf-row .nf-role { font-size: 12px; color: var(--ink-dim); background: #ffffff0a; padding: 3px 8px; border-radius: 6px; }
  .nf-row .nf-assignee { font-size: 12px; font-weight: 600; }
  .nf-priority {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .nf-priority-hoch { color: #E85B4F; background: #E85B4F22; }
  .nf-priority-mittel { color: #E0B33C; background: #E0B33C1f; }
  .nf-priority-niedrig { color: #5FB37A; background: #5FB37A22; }
  .nf-row.nf-todo-hoch { border-color: #E85B4F44; }

  .nf-del {
    background: none; border: none; color: var(--ink-dim); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 6px;
  }
  .nf-del:hover { color: var(--ember); background: #ffffff0a; }

  /* Flame checkbox - the signature element. Burns while open, is snuffed out when done. */
  .nf-flame-check {
    appearance: none; -webkit-appearance: none;
    width: 30px; height: 30px; min-width: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--flame-dim);
    background: var(--night-deep);
    cursor: pointer;
    position: relative;
    transition: box-shadow 0.3s, border-color 0.3s, background 0.3s;
  }
  .nf-flame-check::after {
    content: '';
    position: absolute;
    left: 50%; top: 54%;
    transform: translate(-50%, -50%) scale(1);
    width: 13px; height: 17px;
    background: var(--flame);
    clip-path: path('M5 0C5 3 9 5 9 8.5C9 11 7.2 13 5 13C2.8 13 1 11 1 8.5C1 5 5 3 5 0Z');
    opacity: 1;
    box-shadow: 0 0 10px 2px var(--flame);
    transition: all 0.3s;
    animation: nf-flicker 2.2s ease-in-out infinite;
  }
  .nf-flame-check {
    border-color: var(--flame);
    box-shadow: 0 0 14px 2px #E8B65744, inset 0 0 8px #E8B65722;
  }
  @keyframes nf-flicker {
    0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(-1deg); }
    50% { transform: translate(-50%, -50%) scale(0.92) rotate(1.5deg); }
    75% { transform: translate(-50%, -50%) scale(1.04) rotate(-0.5deg); }
  }
  .nf-flame-check:checked {
    border-color: var(--panel-line);
    box-shadow: none;
    background: var(--panel);
  }
  .nf-flame-check:checked::after {
    background: var(--ink-dim);
    opacity: 0.4;
    box-shadow: none;
    transform: translate(-50%, -50%) scale(0.55);
    animation: none;
  }
  .nf-row.nf-done .nf-name {
    color: var(--ink-dim);
    text-decoration: line-through;
    text-decoration-color: var(--panel-line);
    opacity: 0.55;
    filter: saturate(0.4);
  }

  .nf-add {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .nf-add input, .nf-add select {
    background: var(--night-deep);
    border: 1px solid var(--panel-line);
    color: var(--ink);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }
  .nf-add input { flex: 1; min-width: 120px; }
  .nf-add select { min-width: 100px; flex: 0 1 auto; }
  .nf-add button {
    background: var(--flame);
    color: #1C1508;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .nf-add button:hover { filter: brightness(1.08); }

  .nf-empty {
    color: var(--ink-dim);
    font-size: 13px;
    font-style: italic;
    padding: 6px 2px 12px;
  }

  .nf-footer {
    text-align: center;
    color: var(--ink-dim);
    font-size: 12px;
    margin-top: 8px;
  }
  .nf-footer button {
    background: none; border: none; color: var(--ink-dim);
    text-decoration: underline; cursor: pointer; font-size: 12px; font-family: 'Inter', sans-serif;
  }

  .nf-status { text-align: center; font-size: 13px; color: var(--ink-dim); padding: 60px 0; }
</style>

<div id="nf-root">
  <div class="nf-wrap">
    <div class="nf-topbar">
      <div class="nf-eyebrow">
        <svg viewBox="0 0 10 13" fill="currentColor"><path d="M5 0C5 3 9 5 9 8.5C9 11 7.2 13 5 13C2.8 13 1 11 1 8.5C1 5 5 3 5 0Z"/></svg>
        Nightfever
      </div>
      <button class="nf-settings-toggle" id="nf-settings-toggle" aria-label="Einstellungen">&#x2699;</button>
    </div>
    <h1 class="nf-title" id="nf-heading">Planung</h1>
    <p class="nf-sub">Alle mit diesem Link sehen und bearbeiten dieselbe Planung &#x2014; &#xC4;nderungen sind f&#xFC;r alle sichtbar.</p>

    <div id="nf-settings-panel" class="nf-settings-panel" style="display:none;"></div>

    <div id="nf-app">
      <div class="nf-status">Lade Planung &#x2026;</div>
    </div>
  </div>
</div>

<script>
(function () {
  // Ohne diese Angabe rendert das Handy die Seite in Desktop-Breite und zoomt sie
  // verkleinert hinein — deshalb wirkt alles klein und man muss reinzoomen.
  let viewport = document.querySelector('meta[name="viewport"]');
  if (!viewport) {
    viewport = document.createElement('meta');
    viewport.name = 'viewport';
    document.head.insertBefore(viewport, document.head.firstChild);
  }
  viewport.content = 'width=device-width, initial-scale=1, viewport-fit=cover';
})();

(function () {
  const FIREBASE_URL = 'https://nightfever-planer-default-rtdb.europe-west1.firebasedatabase.app';
  const REMOTE_PATH = FIREBASE_URL.replace(/\/$/, '') + '/nightfever-plan.json';
  let data = null;
  let settingsOpen = false;
  const app = document.getElementById('nf-app');
  const root = document.getElementById('nf-root');
  const settingsPanel = document.getElementById('nf-settings-panel');

  const ACCENTS = {
    flame:   { flame: '#E8B657', dim: '#6B5A30', label: 'Kerze' },
    ember:   { flame: '#C97A4A', dim: '#5C3A2A', label: 'Glut' },
    rose:    { flame: '#D97D96', dim: '#5C3644', label: 'Rose' },
    sage:    { flame: '#8FA97C', dim: '#3E4A34', label: 'Salbei' },
    ice:     { flame: '#7CA9C9', dim: '#33475A', label: 'Eis' },
    violet:  { flame: '#A78FD9', dim: '#453A5C', label: 'Violett' }
  };

  const PRIORITIES = { hoch: { label: 'Dringend', order: 0 }, mittel: { label: 'Mittel', order: 1 }, niedrig: { label: 'Kann warten', order: 2 } };

  // Personenfarben \u2014 bewusst ohne Rot/Gelb/Gr\u00FCn, die sind f\u00FCr die Priorit\u00E4ten reserviert.
  // Reihenfolge nach Eintragung, damit sich unterschiedliche Namen garantiert unterscheiden.
  const PERSON_COLORS = ['#4C86C6', '#3FA9C9', '#7B68D9', '#C2529E', '#9B4F82', '#A08363', '#6B7089', '#4A9B8E'];

  function colorForName(name) {
    if (!name) return null;
    const idx = data.attendees.findIndex(a => a.name === name);
    if (idx >= 0) return PERSON_COLORS[idx % PERSON_COLORS.length];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return PERSON_COLORS[hash % PERSON_COLORS.length];
  }

  function assigneeTag(name) {
    if (!name) return '';
    return `<span class="nf-assignee" style="color:${colorForName(name)}">${escapeHtml(name)}</span>`;
  }

  function sortedTodos() {
    return [...data.todos].sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return (PRIORITIES[a.priority]?.order ?? 1) - (PRIORITIES[b.priority]?.order ?? 1);
    });
  }

  function defaultData() {
    return {
      event: { title: 'Nightfever D\u00FCsseldorf', date: '', place: '' },
      attendees: [],
      tasks: [],
      todos: [],
      theme: { accent: 'flame', mode: 'night' }
    };
  }

  function applyTheme() {
    if (!data.theme) data.theme = { accent: 'flame', mode: 'night' };
    const a = ACCENTS[data.theme.accent] || ACCENTS.flame;
    root.style.setProperty('--flame', a.flame);
    root.style.setProperty('--flame-dim', a.dim);
    root.classList.toggle('nf-light', data.theme.mode === 'day');
  }

  function renderSettings() {
    settingsPanel.style.display = settingsOpen ? 'block' : 'none';
    if (!settingsOpen) return;
    settingsPanel.innerHTML = `
      <h3>Akzentfarbe</h3>
      <div class="nf-swatches">
        ${Object.entries(ACCENTS).map(([key, a]) => `
          <button class="nf-swatch ${data.theme.accent === key ? 'nf-active' : ''}"
            style="background:${a.flame}" data-accent="${key}" title="${a.label}" aria-label="${a.label}"></button>
        `).join('')}
      </div>
      <h3>Hintergrund</h3>
      <div class="nf-mode-toggle">
        <button class="nf-mode-btn ${data.theme.mode !== 'day' ? 'nf-active' : ''}" data-mode="night">Dunkel</button>
        <button class="nf-mode-btn ${data.theme.mode === 'day' ? 'nf-active' : ''}" data-mode="day">Hell</button>
      </div>
    `;
    settingsPanel.querySelectorAll('[data-accent]').forEach(btn => {
      btn.addEventListener('click', () => {
        data.theme.accent = btn.getAttribute('data-accent');
        applyTheme(); setupHomeScreenTags(); save(); renderSettings();
      });
    });
    settingsPanel.querySelectorAll('[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        data.theme.mode = btn.getAttribute('data-mode');
        applyTheme(); setupHomeScreenTags(); save(); renderSettings();
      });
    });
  }

  function uid() { return Math.random().toString(36).slice(2, 9); }

  // --- Home-Bildschirm / App-Optik ---
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    showInstallHint();
  });

  function roundedRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function buildIconDataUrl(bg, accent) {
    const canvas = document.createElement('canvas');
    canvas.width = 192; canvas.height = 192;
    const ctx = canvas.getContext('2d');
    roundedRectPath(ctx, 0, 0, 192, 192, 36);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.save();
    ctx.translate(96, 102);
    ctx.scale(7, 7);
    ctx.translate(-5, -6.5);
    ctx.beginPath();
    ctx.moveTo(5, 0);
    ctx.bezierCurveTo(5, 3, 9, 5, 9, 8.5);
    ctx.bezierCurveTo(9, 11, 7.2, 13, 5, 13);
    ctx.bezierCurveTo(2.8, 13, 1, 11, 1, 8.5);
    ctx.bezierCurveTo(1, 5, 5, 3, 5, 0);
    ctx.closePath();
    ctx.shadowColor = accent;
    ctx.shadowBlur = 10;
    ctx.fillStyle = accent;
    ctx.fill();
    ctx.restore();
    return canvas.toDataURL('image/png');
  }

  function setupHomeScreenTags() {
    try {
      const style = getComputedStyle(root);
      const night = style.getPropertyValue('--night').trim() || '#14172B';
      const flame = style.getPropertyValue('--flame').trim() || '#E8B657';
      const title = data.event.title || 'Nightfever';
      const icon = buildIconDataUrl(night, flame);

      document.title = title;

      const upsert = (selector, tag, attrs) => {
        let el = document.querySelector(selector);
        if (!el) { el = document.createElement(tag); document.head.appendChild(el); }
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
        return el;
      };

      upsert('link[rel="icon"]', 'link', { rel: 'icon', href: icon });
      upsert('link[rel="apple-touch-icon"]', 'link', { rel: 'apple-touch-icon', href: icon });
      upsert('meta[name="apple-mobile-web-app-capable"]', 'meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
      upsert('meta[name="apple-mobile-web-app-title"]', 'meta', { name: 'apple-mobile-web-app-title', content: title });
      upsert('meta[name="theme-color"]', 'meta', { name: 'theme-color', content: night });

      const manifest = {
        name: title, short_name: title.slice(0, 12), start_url: location.href,
        display: 'standalone', background_color: night, theme_color: night,
        icons: [{ src: icon, sizes: '192x192', type: 'image/png' }]
      };
      const manifestUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
      upsert('link[rel="manifest"]', 'link', { rel: 'manifest', href: manifestUrl });
    } catch (e) {
      console.error('Home-Bildschirm-Setup fehlgeschlagen', e);
    }
  }

  function isIos() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  }

  function showInstallHint() {
    if (document.getElementById('nf-install-hint')) return;
    const banner = document.createElement('div');
    banner.id = 'nf-install-hint';
    banner.className = 'nf-install-hint';
    if (deferredInstallPrompt) {
      banner.innerHTML = `<span>Als App speichern f\u00FCr schnelleren Zugriff?</span>
        <button data-hint-action="install">Installieren</button>
        <button class="nf-hint-close" data-hint-action="close" aria-label="Schlie\u00DFen">\u2715</button>`;
    } else if (isIos()) {
      banner.innerHTML = `<span>Zum Home-Bildschirm: unten auf das Teilen-Symbol tippen, dann "Zum Home-Bildschirm"</span>
        <button class="nf-hint-close" data-hint-action="close" aria-label="Schlie\u00DFen">\u2715</button>`;
    } else {
      return;
    }
    root.insertBefore(banner, root.firstChild);
    banner.querySelectorAll('[data-hint-action]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (btn.getAttribute('data-hint-action') === 'install' && deferredInstallPrompt) {
          await deferredInstallPrompt.prompt();
          deferredInstallPrompt = null;
        }
        banner.remove();
      });
    });
  }

  async function fetchRemote() {
    const res = await fetch(REMOTE_PATH);
    if (!res.ok) throw new Error('Firebase-Antwort nicht ok: ' + res.status);
    return await res.json();
  }

  // Firebase speichert leere Listen/Objekte gar nicht erst — beim Laden fehlen
  // sie dann komplett. Hier füllen wir alles, was fehlt, mit sinnvollen Standardwerten.
  function normalizeData(remote) {
    const base = defaultData();
    if (!remote || typeof remote !== 'object') return base;
    return {
      event: Object.assign({}, base.event, remote.event || {}),
      attendees: Array.isArray(remote.attendees) ? remote.attendees : [],
      tasks: Array.isArray(remote.tasks) ? remote.tasks : [],
      todos: Array.isArray(remote.todos) ? remote.todos : [],
      theme: remote.theme || base.theme
    };
  }

  async function load() {
    try {
      const remote = await fetchRemote();
      data = normalizeData(remote);
    } catch (e) {
      console.error('Laden fehlgeschlagen', e);
      data = defaultData();
    }
    try {
      applyTheme();
      setupHomeScreenTags();
      if (isIos()) showInstallHint();
      const toggleBtn = document.getElementById('nf-settings-toggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          settingsOpen = !settingsOpen;
          renderSettings();
        });
      }
      render();
    } catch (e) {
      console.error('Anzeigen fehlgeschlagen', e);
      app.innerHTML = '<div class="nf-status">Etwas ist beim Laden schiefgelaufen. Bitte Seite neu laden.</div>';
    }
    startPolling();
  }

  function startPolling() {
    setInterval(async () => {
      if (document.hidden) return;
      try {
        const remote = await fetchRemote();
        const fresh = normalizeData(remote);
        if (JSON.stringify(fresh) !== JSON.stringify(data)) {
          data = fresh;
          applyTheme();
          render();
        }
      } catch (e) {
        console.error('Aktualisieren fehlgeschlagen', e);
      }
    }, 8000);
  }

  async function save() {
    try {
      const res = await fetch(REMOTE_PATH, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) console.error('Speichern fehlgeschlagen', res.status);
    } catch (e) {
      console.error('Speicherfehler', e);
    }
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function render() {
    document.getElementById('nf-heading').textContent = data.event.title || 'Planung';
    renderSettings();

    const attendeeOptions = data.attendees
      .map(a => `<option value="${escapeHtml(a.name)}">${escapeHtml(a.name)}</option>`)
      .join('');

    app.innerHTML = `
      <div class="nf-event-inputs">
        <input name="title" placeholder="Titel des Abends" value="${escapeHtml(data.event.title)}" />
        <input name="date" placeholder="Datum / Uhrzeit" value="${escapeHtml(data.event.date)}" />
        <input name="place" placeholder="Ort" value="${escapeHtml(data.event.place)}" />
      </div>

      <section class="nf-section">
        <h2>Wer ist da <span class="nf-count">${data.attendees.length}</span></h2>
        <p class="nf-hint">Alle, die an dem Abend mit anpacken oder dabei sind.</p>
        <ul class="nf-list" id="nf-attendee-list">
          ${data.attendees.length ? data.attendees.map(a => `
            <li class="nf-row" data-id="${a.id}" data-kind="attendee">
              <span class="nf-name">${escapeHtml(a.name)}</span>
              ${a.role ? `<span class="nf-role">${escapeHtml(a.role)}</span>` : ''}
              <button class="nf-del" data-action="del-attendee" data-id="${a.id}" aria-label="Entfernen">\u2715</button>
            </li>`).join('') : '<li class="nf-empty">Noch niemand eingetragen.</li>'}
        </ul>
        <div class="nf-add">
          <input id="nf-attendee-name" placeholder="Name" />
          <input id="nf-attendee-role" placeholder="Rolle (optional, z. B. Anbetung, Empfang)" />
          <button data-action="add-attendee">Hinzuf\u00FCgen</button>
        </div>
      </section>

      <details class="nf-section" id="nf-services-section" ${data.tasks.length ? 'open' : ''}>
        <summary>
          <h2>Dienste <span class="nf-count">${data.tasks.filter(t=>t.done).length}/${data.tasks.length}</span></h2>
        </summary>
        <p class="nf-hint">Feste Rollen f\u00FCr den Abend (z. B. Einladung, Empfang, Anbetung) mit Zust\u00E4ndigkeit \u2014 praktisch, sobald ihr mehr Leute seid. Flamme antippen, wenn erledigt.</p>
        <ul class="nf-list" id="nf-task-list">
          ${data.tasks.length ? data.tasks.map(t => `
            <li class="nf-row ${t.done ? 'nf-done' : ''}" data-id="${t.id}">
              <input type="checkbox" class="nf-flame-check" data-action="toggle-task" data-id="${t.id}" ${t.done ? 'checked' : ''} aria-label="Dienst erledigt" />
              <span class="nf-name">${escapeHtml(t.text)}</span>
              ${assigneeTag(t.assignee)}
              <button class="nf-del" data-action="del-task" data-id="${t.id}" aria-label="Entfernen">\u2715</button>
            </li>`).join('') : '<li class="nf-empty">Noch keine Dienste eingetragen.</li>'}
        </ul>
        <div class="nf-add">
          <input id="nf-task-text" placeholder="Dienst, z. B. Empfang" />
          <select id="nf-task-assignee">
            <option value="">\u2014 zuweisen \u2014</option>
            ${attendeeOptions}
          </select>
          <button data-action="add-task">Hinzuf\u00FCgen</button>
        </div>
      </details>

      <section class="nf-section">
        <h2>Offene Todos <span class="nf-count">${data.todos.filter(t=>t.done).length}/${data.todos.length}</span></h2>
        <p class="nf-hint">Dinge, die vorher noch gekl\u00E4rt oder besorgt werden m\u00FCssen.</p>
        <ul class="nf-list" id="nf-todo-list">
          ${data.todos.length ? sortedTodos().map(t => `
            <li class="nf-row ${t.done ? 'nf-done' : ''} nf-todo-${t.priority || 'mittel'}" data-id="${t.id}">
              <input type="checkbox" class="nf-flame-check" data-action="toggle-todo" data-id="${t.id}" ${t.done ? 'checked' : ''} aria-label="Todo erledigt" />
              <span class="nf-name">${escapeHtml(t.text)}</span>
              ${assigneeTag(t.assignee)}
              ${!t.done ? `<span class="nf-priority nf-priority-${t.priority || 'mittel'}">${PRIORITIES[t.priority || 'mittel'].label}</span>` : ''}
              <button class="nf-del" data-action="del-todo" data-id="${t.id}" aria-label="Entfernen">\u2715</button>
            </li>`).join('') : '<li class="nf-empty">Keine offenen Punkte.</li>'}
        </ul>
        <div class="nf-add">
          <input id="nf-todo-text" placeholder="Todo, z. B. Kerzen bestellen" />
          <select id="nf-todo-assignee">
            <option value="">\u2014 zuweisen \u2014</option>
            ${attendeeOptions}
          </select>
          <select id="nf-todo-priority">
            <option value="hoch">Dringend</option>
            <option value="mittel" selected>Mittel</option>
            <option value="niedrig">Kann warten</option>
          </select>
          <button data-action="add-todo">Hinzuf\u00FCgen</button>
        </div>
      </section>

      <div class="nf-footer">
        <button data-action="reset">Ganze Planung zur\u00FCcksetzen</button>
      </div>
    `;

    wireEvents();
  }

  function wireEvents() {
    app.querySelectorAll('.nf-event-inputs input').forEach(inp => {
      inp.addEventListener('change', () => {
        data.event[inp.name] = inp.value;
        save();
        if (inp.name === 'title') setupHomeScreenTags();
      });
    });

    app.querySelectorAll('[data-action]').forEach(el => {
      const action = el.getAttribute('data-action');
      const id = el.getAttribute('data-id');

      if (action === 'add-attendee') {
        el.addEventListener('click', () => {
          const nameEl = document.getElementById('nf-attendee-name');
          const roleEl = document.getElementById('nf-attendee-role');
          if (!nameEl.value.trim()) return;
          data.attendees.push({ id: uid(), name: nameEl.value.trim(), role: roleEl.value.trim() });
          save(); render();
        });
      }
      if (action === 'del-attendee') {
        el.addEventListener('click', () => {
          data.attendees = data.attendees.filter(a => a.id !== id);
          save(); render();
        });
      }
      if (action === 'add-task') {
        el.addEventListener('click', () => {
          const textEl = document.getElementById('nf-task-text');
          const assigneeEl = document.getElementById('nf-task-assignee');
          if (!textEl.value.trim()) return;
          data.tasks.push({ id: uid(), text: textEl.value.trim(), assignee: assigneeEl.value, done: false });
          save(); render();
        });
      }
      if (action === 'toggle-task') {
        el.addEventListener('change', () => {
          const t = data.tasks.find(t => t.id === id);
          if (t) t.done = el.checked;
          save(); render();
        });
      }
      if (action === 'del-task') {
        el.addEventListener('click', () => {
          data.tasks = data.tasks.filter(t => t.id !== id);
          save(); render();
        });
      }
      if (action === 'add-todo') {
        el.addEventListener('click', () => {
          const textEl = document.getElementById('nf-todo-text');
          const assigneeEl = document.getElementById('nf-todo-assignee');
          const priorityEl = document.getElementById('nf-todo-priority');
          if (!textEl.value.trim()) return;
          data.todos.push({
            id: uid(),
            text: textEl.value.trim(),
            assignee: assigneeEl.value,
            priority: priorityEl.value,
            done: false
          });
          save(); render();
        });
      }
      if (action === 'toggle-todo') {
        el.addEventListener('change', () => {
          const t = data.todos.find(t => t.id === id);
          if (t) t.done = el.checked;
          save(); render();
        });
      }
      if (action === 'del-todo') {
        el.addEventListener('click', () => {
          data.todos = data.todos.filter(t => t.id !== id);
          save(); render();
        });
      }
      if (action === 'reset') {
        el.addEventListener('click', () => {
          if (confirm('Wirklich die ganze Planung zur\u00FCcksetzen? Das kann nicht r\u00FCckg\u00E4ngig gemacht werden.')) {
            data = defaultData();
            save(); render();
          }
        });
      }
    });

    // Enter-Taste in Eingabefeldern
    const enterMap = {
      'nf-attendee-name': 'add-attendee',
      'nf-attendee-role': 'add-attendee',
      'nf-task-text': 'add-task',
      'nf-todo-text': 'add-todo'
    };
    Object.entries(enterMap).forEach(([inputId, action]) => {
      const inp = document.getElementById(inputId);
      if (inp) inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') app.querySelector(`[data-action="${action}"]`).click();
      });
    });
  }

  load();
})();
</script>
